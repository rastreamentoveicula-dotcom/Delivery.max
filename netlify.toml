# =====================================================
# Delivery Max - Configuração de deploy na Netlify
# =====================================================
# Projeto Supabase: DeliveryMax (região sa-east-1 / São Paulo)
# As credenciais de produção ficam em .env.production (lido pelo `vite build`),
# por isso o deploy funciona sem cadastrar nenhuma variável no painel.
# =====================================================

[build]
  # Instala as dependências (incluindo as de desenvolvimento) e gera a pasta de
  # produção. O `npm install --include=dev` antes do build é uma proteção extra:
  # garante o Vite disponível mesmo que a etapa de instalação da Netlify rode em
  # modo produção (NODE_ENV=production), que ignora devDependencies.
  command = "npm install --include=dev --no-audit --no-fund && npm run build"
  # Pasta publicada (saída do Vite)
  publish = "dist"
  # Variáveis de build disponíveis no ambiente da Netlify
  #
  # IMPORTANTE (--include=dev):
  # A Netlify define NODE_ENV=production durante a instalação, e nesse modo o npm
  # ignora as devDependencies — onde ficam o Vite, o Tailwind e o TypeScript.
  # Sem esta flag o build quebra com "sh: 1: vite: not found".
  environment = { NODE_VERSION = "22", NPM_FLAGS = "--include=dev --no-audit --no-fund" }

# Deploys de preview (pull requests / branches) usam o mesmo build
[context.deploy-preview]
  command = "npm install --include=dev --no-audit --no-fund && npm run build"

[context.branch-deploy]
  command = "npm install --include=dev --no-audit --no-fund && npm run build"

[context.production]
  command = "npm install --include=dev --no-audit --no-fund && npm run build"

# -----------------------------------------------------
# Redirecionamentos: SPA (React Router)
# Qualquer rota desconhecida cai no index.html, então
# /dashboard, /login, /track-order/123 etc funcionam
# mesmo sendo acessadas diretamente.
# -----------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------
# Cabeçalhos de segurança e cache
# -----------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# Assets com hash no nome podem ser cacheados para sempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML sempre revalidado para pegar novos deploys imediatamente
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
